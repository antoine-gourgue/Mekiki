name: Release

# Every push to main that passes the checks becomes a version: the Windows installer is
# built, the update signed and both published as a GitHub release. Installed apps then
# offer the update, and the landing page's download link points at the new installer.
#
# The update signing key reaches a single step, "Sign the update", which runs the Tauri
# CLI's signer on the finished installer and nothing else. Installing the dependencies and
# building the engine, the frontend and the app all happen before it, without the key: an
# install script or a compromised package could otherwise read it and sign a malicious
# update that every installed Mekiki would accept. For the same reason, actions are pinned
# to full commit SHAs, so a moved tag cannot change the code that runs here.
on:
  push:
    branches: [main]
    # Docs, the website's Vercel settings and the workflows themselves do not change the app.
    paths-ignore:
      - "**.md"
      - "desktop/vercel.json"
      - "desktop/.vercelignore"
      - ".github/**"
  # Publishes again by hand, e.g. after the signing key secret changed.
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      # Only whether the secret is set: the key itself is given to the signing step alone.
      - name: Check the update signing key
        id: key
        shell: pwsh
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if ($env:HAS_KEY -eq 'true') {
            "ready=true" >> $env:GITHUB_OUTPUT
          } else {
            "::warning::No TAURI_SIGNING_PRIVATE_KEY secret: no version is published. Add it in Settings > Secrets and variables > Actions."
            "ready=false" >> $env:GITHUB_OUTPUT
          }

      # Nothing pushes with git (the release and its tag go through the API), so the token
      # is not left in .git/config, where an install script could read it.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: steps.key.outputs.ready == 'true'
        with:
          persist-credentials: false

      # The base (major.minor) comes from package.json; the run number makes every
      # release newer than the last, which is how installed apps spot an update.
      - name: Pick the version
        id: version
        if: steps.key.outputs.ready == 'true'
        shell: pwsh
        run: |
          $base = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version -replace '\.\d+$', ''
          "number=$base.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      # Before the engine: its build script names the sidecar after the Rust target.
      # Pinned to a commit of master with the toolchain as an input, as the action's README
      # asks: its `stable` branch is rewritten and its old commits are garbage-collected.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        if: steps.key.outputs.ready == 'true'
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.key.outputs.ready == 'true'
        with:
          workspaces: desktop/src-tauri -> target

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        if: steps.key.outputs.ready == 'true'
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        if: steps.key.outputs.ready == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Write the version in the app and the engine
        if: steps.key.outputs.ready == 'true'
        working-directory: desktop
        run: |
          npm ci
          npm run version:set -- ${{ steps.version.outputs.number }}

      - name: Build the engine sidecar
        if: steps.key.outputs.ready == 'true'
        working-directory: engine
        run: |
          uv sync --locked --group bundle
          uv run python scripts/build_sidecar.py

      # Into .output/public, the frontendDist of tauri.conf.json.
      - name: Build the frontend
        if: steps.key.outputs.ready == 'true'
        working-directory: desktop
        run: npm run generate

      # Compiles the app and makes the NSIS installer, without signing the update. The extra
      # config empties beforeBuildCommand, so `tauri build` does not generate the frontend
      # again; the publish step passes the same configs, so cargo finds the app up to date.
      # The CLI is started with node: in PowerShell, `npm run tauri -- …` can lose its `--`,
      # and `node_modules/.bin/tauri` resolves to the sh shim.
      - name: Build the app and its installer, unsigned
        if: steps.key.outputs.ready == 'true'
        working-directory: desktop
        shell: pwsh
        run: |
          '{ "build": { "beforeBuildCommand": "" } }' | Set-Content "$env:RUNNER_TEMP/tauri.prebuilt.json"
          node node_modules/@tauri-apps/cli/tauri.js build --config src-tauri/tauri.bundle.json --config "$env:RUNNER_TEMP/tauri.prebuilt.json" --no-sign

      # The notes are written in French for the release page and the app's update dialog.
      - name: Read the release notes
        id: notes
        if: steps.key.outputs.ready == 'true'
        shell: pwsh
        run: |
          $notes = (Get-Content desktop/release-notes.md -Raw -Encoding utf8).Trim()
          if (-not $notes) { $notes = 'Corrections et améliorations.' }
          $end = "NOTES_$([guid]::NewGuid().ToString('N'))"
          "body<<$end`n$notes`n$end" >> $env:GITHUB_OUTPUT

      # The only step given the key, whose signature installed apps check against the public
      # key in tauri.conf.json. It writes the installer's .sig, bound to the version as
      # `tauri build` would do, and runs nothing but the Tauri CLI: no install, no build.
      - name: Sign the update
        if: steps.key.outputs.ready == 'true'
        working-directory: desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          $installer = @(Get-Item "src-tauri/target/release/bundle/nsis/Mekiki_$($env:VERSION)_*-setup.exe")
          if ($installer.Count -ne 1) { throw "Expected one installer for $env:VERSION, found $($installer.Count)." }
          node node_modules/@tauri-apps/cli/tauri.js signer sign --app-version $env:VERSION $installer[0].FullName

      # Publishes what the steps above built and signed: the installer, its .sig and the
      # latest.json the updater reads. `--no-bundle` stops the action's `tauri build` from
      # bundling again, which would need the key; with the build step's CLI call and
      # configs, cargo finds the app up to date.
      - name: Publish the release
        if: steps.key.outputs.ready == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: node node_modules/@tauri-apps/cli/tauri.js
          args: --config src-tauri/tauri.bundle.json --config ${{ runner.temp }}/tauri.prebuilt.json --no-bundle
          tagName: v${{ steps.version.outputs.number }}
          releaseName: Mekiki ${{ steps.version.outputs.number }}
          releaseCommitish: ${{ github.sha }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      - name: Publish the installer under a fixed name for the download link
        if: steps.key.outputs.ready == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe |
            Select-Object -First 1
          Copy-Item $installer.FullName Mekiki-Setup.exe
          gh release upload "v${{ steps.version.outputs.number }}" Mekiki-Setup.exe --clobber
