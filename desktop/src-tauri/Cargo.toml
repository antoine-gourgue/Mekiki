[package]
name = "mekiki"
version = "0.1.0"
description = "Achat-revente de cartes TCG importées du Japon"
authors = ["Antoine Gourgue"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash between the library and the binary on Windows.
name = "mekiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
# The code generated from tauri.conf.json (the updater settings) uses it.
serde_json = "1"

# Updates ship as signed GitHub releases; the app offers them and restarts itself.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
