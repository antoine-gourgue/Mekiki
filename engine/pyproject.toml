[project]
name = "mekiki-engine"
version = "0.1.0"
description = "Local engine behind Mekiki: stock, landed costs and margins for TCG cards imported from Japan."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  # 2.1 makes its Cython modules mandatory, and Windows Smart App Control blocks freshly
  # released unsigned .pyd files; 2.0 falls back to pure Python when they fail to load.
  "sqlalchemy>=2.0.30,<2.1",
  "pydantic>=2.8",
  "httpx>=0.27",
  "ecdsa>=0.19",
]

[project.scripts]
mekiki-engine = "mekiki_engine.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]
bundle = [
  "pyinstaller>=6.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mekiki_engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests feed full-width and Japanese characters on purpose.
"tests/**" = ["RUF001"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependencies are declared as default arguments by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.pytest.ini_options]
testpaths = ["tests"]
