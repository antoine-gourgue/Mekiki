<script>
  function gaLikeClick(){
    var pathArray = location.pathname.split('/');
    var dimension3 = '';
    switch(pathArray[1]) {
      case 'category':
        dimension3 = 'category';
        break;
      case 'brand':
        dimension3 = 'brand';
        break;
      case 'shop':
        dimension3 = 'shop';
        break;
      case 'search':
        dimension3 = 'search';
        break;
    }
    ga('send', 'event', 'ui_action', 'search', 'click_like', { 'dimension3': dimension3,
    });
  }
</script>
